    <text x="134" y="65" font-size="25" font-weight="600" fill="#315F91" textLength="150" lengthAdjust="spacingAndGlyphs">Teleoperation</text>
    <line x1="372" y1="56" x2="395" y2="56" stroke="#8793A2" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 45L408 56L392 67Z" fill="#8793A2"/>
    <rect x="420" y="24" width="350" height="64" rx="18" fill="#F3F0FF" stroke="#AA9AE6" stroke-width="2"/>
