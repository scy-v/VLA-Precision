    <text x="872" y="63" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3</text>
    <text x="904" y="65" font-size="24" font-weight="600" fill="#965B2D" textLength="250" lengthAdjust="spacingAndGlyphs">Online RL Post-Training</text>
