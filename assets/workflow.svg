<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 112" role="img" aria-labelledby="title desc">
  <title id="title">VLA-Precision workflow</title>
  <desc id="desc">Teleoperation, supervised fine-tuning, online RL post-training, and real-robot deployment.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="10" y="24" width="350" height="64" rx="18" fill="#EEF6FF" stroke="#8BB9F0" stroke-width="2"/>
