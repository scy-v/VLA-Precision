    <line x1="782" y1="56" x2="805" y2="56" stroke="#8793A2" stroke-width="4" stroke-linecap="round"/>
    <path d="M802 45L818 56L802 67Z" fill="#8793A2"/>
    <rect x="830" y="24" width="350" height="64" rx="18" fill="#FFF4E8" stroke="#EAB277" stroke-width="2"/>
